<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MailClient</title>
    <!-- Use Google Fonts (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Link to custom CSS -->
    <link rel="stylesheet" href="../static/css/style.css">
</head>
<body>
    <!-- Notifications -->
    <div id="notification-container"></div>

    <!-- Login View -->
    <div id="login-view" class="view active">
        <div class="login-card glass">
            <h2>Welcome Back</h2>
            <p>Sign in with your App Password</p>
            <form id="login-form">
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required placeholder="you@gmail.com">
                </div>
                <div class="input-group">
                    <label for="password">App Password</label>
                    <input type="password" id="password" required placeholder="••••••••••••••••">
                </div>
                <button type="submit" id="login-btn" class="btn-primary">Sign In</button>
            </form>
        </div>
    </div>

    <!-- Main App View -->
    <div id="app-view" class="view">
        <!-- Sidebar -->
        <aside class="sidebar glass">
            <div class="sidebar-header">
                <h2>Mail</h2>
            </div>
            <button id="compose-btn" class="btn-compose">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
                Compose
            </button>
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active" id="nav-inbox" data-folder="inbox">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-6l-2 3h-4l-2-3H2"></path><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path></svg>
                    Inbox
                </a>
                <a href="#" class="nav-item" id="nav-starred" data-folder="starred">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                    Starred
                </a>
                <a href="#" class="nav-item" id="nav-sent" data-folder="sent">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    Sent Mail
                </a>
                <a href="#" class="nav-item" id="nav-trash" data-folder="trash">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                    Trash
                </a>
            </nav>
            <div class="sidebar-footer">
                <button id="refresh-btn" class="btn-ghost">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6"></path><path d="M1 20v-6h6"></path><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
                    Refresh
                </button>
                <button id="logout-btn" class="btn-ghost" style="color: var(--error);">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                    Sign Out
                </button>
            </div>
        </aside>

        <!-- Main Content (Dashboard) -->
        <main id="dashboard-content" class="main-content">
            <!-- Email List View -->
            <div id="email-list-view" class="view-panel glass active">
                <div class="list-header">
                    <h3 id="folder-title">Inbox</h3>
                    <div class="search-container">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        <input type="text" id="search-input" placeholder="Search in emails...">
                    </div>
                </div>
                <div id="email-list" class="email-list">
                    <!-- Loading skeleton -->
                    <div class="skeleton-item"></div>
                    <div class="skeleton-item"></div>
                    <div class="skeleton-item"></div>
                </div>
            </div>

            <!-- Email Detail View -->
            <div id="email-detail-view" class="view-panel glass hidden">
                <div class="detail-header-top">
                    <button id="back-to-inbox" class="btn-icon" title="Back to Inbox">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                    </button>
                    <div class="detail-actions" style="display: flex; gap: 0.5rem;">
                        <button id="detail-star-btn" class="btn-icon star-btn" title="Star Email">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                        </button>
                        <button id="detail-unread-btn" class="btn-icon" title="Mark as Unread">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3" fill="currentColor"></circle></svg>
                        </button>
                        <button id="delete-btn" class="btn-icon" title="Delete Email">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                        </button>
                    </div>
                </div>
                <div class="detail-header-main">
                    <h2 id="detail-subject">Subject</h2>
                </div>
                <div class="detail-meta">
                    <div class="meta-avatar" id="detail-avatar">A</div>
                    <div class="meta-info">
                        <div class="meta-from" id="detail-from">Sender</div>
                        <div class="meta-to">to me</div>
                    </div>
                    <div class="meta-date" id="detail-date">Date</div>
                </div>
                <div class="detail-body">
                    <iframe id="detail-iframe" src="about:blank"></iframe>
                </div>
            </div>
        </main>
    </div>

    <!-- Compose Modal -->
    <div id="compose-modal" class="modal">
        <div class="modal-content glass-strong">
            <div class="modal-header">
                <h2>New Message</h2>
                <button id="close-compose" class="btn-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div class="modal-body">
                <form id="compose-form">
                    <div class="input-row">
                        <input type="email" id="compose-to" required placeholder="To">
                    </div>
                    <div class="input-row">
                        <input type="text" id="compose-subject" placeholder="Subject">
                    </div>
                    <div class="input-row flex-1">
                        <textarea id="compose-body" required placeholder="Type your message here..."></textarea>
                    </div>
                    <div class="modal-footer">
                        <button type="submit" id="send-btn" class="btn-primary">
                            <span>Send</span>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="../static/js/app.js"></script>
</body>
</html>
